<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Map Viewer</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine/dist/leaflet-routing-machine.js"></script>
    <script type="module">
        import Openrouteservice from 'https://cdn.jsdelivr.net/npm/openrouteservice-js@0.4.1/+esm'
    </script>

    <script src="{{ url_for('static', filename='L.Routing.OpenRouteServiceV2.js') }}"></script>
    <style>
        #map {
            height: 600px;
        }

        .leaflet-routing-container {
            background-color: #ffffff;
            /* White background for a clean look */
            border: 1px solid #ccc;
            /* Add a subtle border */
            border-radius: 5px;
            /* Rounded corners */
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
            /* Soft shadow for depth */
            padding: 10px;
            /* Add some padding */
            font-family: Arial, sans-serif;
            /* Use a clean font */
            font-size: 14px;
            /* Adjust font size for readability */
        }

        .leaflet-routing-container .leaflet-routing-alt {
            border-top: 1px solid #ddd;
            /* Add a divider between alternatives */
            margin-top: 5px;
            padding-top: 5px;
        }

        .leaflet-routing-container-hidden {
            display: none !important;
            /* Hide the container when not in use */
        }
    </style>
</head>

<body>
    <h1>My Shapefile Map</h1>
    <input type="file" id="fileInput" accept=".geojson">
    <div id="map"></div>

    <h1>Query Student API</h1>
    <form id="queryStudentForm">
        <label for="student-id">Student ID:</label>
        <input type="text" id="student-id" name="student-id" required>
        <label for="university-id">University ID:</label>
        <input type="text" id="university-id" name="university-id" required>
        <button type="submit">Submit</button>
    </form>

    <h2>Response:</h2>
    <pre id="responseOutput"></pre>

    <script>

        document.getElementById("queryStudentForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const studentId = document.getElementById("student-id").value;
            const universityId = document.getElementById("university-id").value;
            const responseOutput = document.getElementById("responseOutput");

            try {
                const response = await fetch('/post_query_student', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'student-id': studentId,
                        'university-id' : universityId
                    }),
                });

                const data = await response.json();
                responseOutput.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                responseOutput.textContent = `Error: ${error}`;
            }
        });

        // Initialize the map
        const map = L.map('map').setView([37.8, -96], 10); // Center and zoom to USA roughly

        // Add a base tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Fetch GeoJSON for universities (Optional: Uncomment if needed)
        /*
        fetch('/universities')
            .then(response => response.json())
            .then(geojson => {
                const geojsonLayer = L.geoJSON(geojson, {
                    style: {
                        color: 'blue',
                        weight: 2,
                        opacity: 0.6,
                        fillOpacity: 0.4
                    },
                    onEachFeature: (feature, layer) => {
                        layer.bindPopup(`<b>${feature.properties.name ?? ""}</b>`);
                    }
                }).addTo(map);
    
                // Fit map bounds to the loaded GeoJSON layer
                map.fitBounds(geojsonLayer.getBounds());
            })
            .catch(error => console.error("Error loading GeoJSON:", error));
        */

        // Add Routing Function
        fetch('/random_student_uni')
            .then(response => response.json())
            .then(geojson => {
                const features = geojson.features;

                // Extract coordinates for student and university
                const studentCoords = features[0].geometry.coordinates; // [lng, lat]
                const uniCoords = features[1].geometry.coordinates[0][0][0]; // [lng, lat]

                const geojsonLayer = L.geoJSON(geojson, {
                    style: {
                        color: 'blue',
                        weight: 2,
                        opacity: 0.6,
                        fillOpacity: 0.4
                    },
                    onEachFeature: (feature, layer) => {
                        layer.bindPopup(`<b>${feature.properties.name ?? ""}</b>`);
                    }
                }).addTo(map);

                // Fit map bounds to the loaded GeoJSON layer
                map.fitBounds(geojsonLayer.getBounds());



                // Add routing between student and university
                L.Routing.control({
                    waypoints: [
                        L.latLng(studentCoords[1], studentCoords[0]), // Leaflet uses [lat, lng]
                        L.latLng(uniCoords[1], uniCoords[0])
                    ],
                    routeWhileDragging: false,
                    showAlternatives: false,
                    altLineOptions: { styles: [{ color: 'blue', opacity: 0.7, weight: 3 }] },
                    router: new L.Routing.openrouteserviceV2(
                        '5b3ce3597851110001cf624820b56b97186d4419b66f4c9f3c597718',
                        {
                            profile: "driving-car",
                            geometry_simplify: true // Needs to do _decodePolyline and smaller request
                        }
                    ),
                    createMarker: () => null // Suppress default waypoint markers
                }).addTo(map);
            })
            .catch(error => console.error('Error fetching data:', error));
    </script>

</body>

</html>
